# Ninedex behind Caddy (HTTPS with an internal certificate).
# Start with:  docker compose -f docker-compose.https.yml up -d --build
# (copy this file and Caddyfile.example -> Caddyfile next to the Dockerfile first)
services:
  ninedex:
    build: .
    container_name: ninedex
    restart: unless-stopped
    environment:
      TZ: "Europe/Berlin"
    volumes:
      - ./data:/data
    # no "ports": Caddy reaches the app through the internal Docker network

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data      # keep this volume: it holds the certificate authority
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
